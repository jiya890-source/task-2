<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Candidate Email Response Tool</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">
      <h1>HR Candidate Email Response Tool</h1>
      <p class="subtitle">Send professional email responses to job candidates</p>

      <form id="candidateForm">

        <label>Candidate Status</label>

        <div class="status-options">
          <label>
            <input type="radio" name="status" value="Selected" checked>
            Selected
          </label>

          <label>
            <input type="radio" name="status" value="Rejected">
            Rejected
          </label>
        </div>

        <label for="candidateName">Candidate Name</label>
        <input
          type="text"
          id="candidateName"
          placeholder="Enter candidate name"
        >
        <span id="nameError" class="error"></span>

        <label for="candidateEmail">Candidate Email</label>
        <input
          type="email"
          id="candidateEmail"
          placeholder="Enter candidate email"
        >
        <span id="emailError" class="error"></span>

        <label for="position">Position Applied</label>
        <input
          type="text"
          id="position"
          placeholder="e.g. Frontend Developer"
        >
        <span id="positionError" class="error"></span>

        <div class="buttons">
          <button type="button" id="previewBtn">
            Preview Email
          </button>

          <button type="submit" id="sendBtn">
            Send Email
          </button>
        </div>

      </form>

      <div id="message"></div>
    </div>

    <!-- Email Preview -->
    <div id="preview" class="preview hidden">
      <h2>Email Preview</h2>

      <p><strong>Subject:</strong></p>
      <p id="previewSubject"></p>

      <hr>

      <p id="previewBody"></p>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
